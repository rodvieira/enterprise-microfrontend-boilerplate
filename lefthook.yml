pre-commit:
  commands:
    format:
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,json}"
      run: pnpm biome check --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    boundaries:
      run: pnpm check:boundaries
    shared-deps:
      run: pnpm check:shared-deps
