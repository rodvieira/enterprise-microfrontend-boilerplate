name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Boundary check
        run: pnpm check:boundaries

      - name: Shared deps drift check
        run: pnpm check:shared-deps

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true # a new upstream advisory must not block an unrelated PR; reviewed rather than enforced
