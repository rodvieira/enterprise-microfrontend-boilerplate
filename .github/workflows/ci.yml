name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json, and specifying both is a hard error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Boundary check
        run: pnpm check:boundaries

      - name: Shared deps drift check
        run: pnpm check:shared-deps

      # Chromium only, matching playwright.config.ts's default project — no
      # cross-browser projects are defined yet (005-guard-rails research D2).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: pnpm e2e

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true # a new upstream advisory must not block an unrelated PR; reviewed rather than enforced
