name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json, and specifying both is a hard error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Boundary check
        run: pnpm check:boundaries

      - name: Shared deps drift check
        run: pnpm check:shared-deps

      # Runs after Build: it packs what packages/*/dist actually contains, so
      # an unbuilt tree would report a false failure.
      - name: Publishable package shape
        run: pnpm check:package-exports

      # Chromium only, matching playwright.config.ts's default project — no
      # cross-browser projects are defined yet.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: pnpm e2e

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true # a new upstream advisory must not block an unrelated PR; reviewed rather than enforced

  # CVE/dependency scanning, distinct from pnpm audit above. No step-level
  # Action exists for OSV-Scanner — only this
  # reusable-workflow form (confirmed against google.github.io/osv-scanner/github-action/).
  osv-scan:
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0"
    with:
      scan-args: |-
        --recursive
        ./
      # Report-only, the tool's own native switch — not a bolted-on
      # continue-on-error. Same posture as pnpm audit above ("a new
      # upstream advisory must not block an unrelated PR"), arrived at
      # independently for the same reason, not copied unexamined.
      fail-on-vuln: false

  # Socket's supply-chain scan job was removed (ADR-0017) — it requires a
  # SOCKET_SECURITY_API_KEY repository secret nobody configured, and ran on
  # every push/PR failing for that reason alone. OSV-Scanner above still
  # covers CVE/advisory scanning.
