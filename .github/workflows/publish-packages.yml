name: publish-packages

# Deliberately NOT `push`/`pull_request` — those trigger the `quality` job in
# ci.yml on every commit. A live publish to GitHub Packages is a
# hard-to-reverse action against a real external registry (research D5,
# FR-019, SC-006): it only ever runs when a maintainer explicitly asks for
# it, either by hand (workflow_dispatch) or by cutting a release tag.
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@enterprise-mfe'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Version or publish
        uses: changesets/action@v1
        with:
          # No `publish:` command override here — @changesets/cli's own
          # `changeset publish` already skips every private package
          # (apps/shell, apps/dashboard, apps/admin, apps/config-typescript,
          # apps/config-biome), publishing only the four packages/*
          # package-publish-contract.md names.
          publish: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
