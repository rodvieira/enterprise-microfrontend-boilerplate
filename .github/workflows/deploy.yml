name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build dashboard remote
        run: pnpm --filter @enterprise-mfe/dashboard run build

      - name: Build admin remote
        run: pnpm --filter @enterprise-mfe/admin run build

      - name: Build shell (production)
        run: FEDERATION_ENV=production pnpm --filter @enterprise-mfe/shell run build

      # One GitHub Pages site composing all three independent static
      # builds: the shell at the site root, its client-side routes
      # (/dashboard, /admin — owned by apps/shell's own router). Remote
      # assets go under a separate /remotes/<name>/ namespace, not
      # /dashboard or /admin themselves — those paths already belong to
      # the shell's router. Deploying a remote's own standalone
      # index.html at the exact path the shell's router owns meant a
      # hard navigation (page load, not a client-side link) to
      # "/dashboard/" was served by GitHub Pages' static file server as
      # the standalone dashboard app, never reaching the shell at all.
      # See ADR-0019.
      - name: Assemble Pages site
        run: |
          mkdir -p _site/remotes/dashboard _site/remotes/admin
          cp -r apps/shell/dist/. _site/
          cp -r apps/dashboard/dist/. _site/remotes/dashboard/
          cp -r apps/admin/dist/. _site/remotes/admin/
          # GitHub Pages serves static files with no server-side rewrite:
          # a hard navigation to a shell client-side route (e.g.
          # "/dashboard", which has no matching file) gets GitHub's own
          # 404 page, never the shell's JS. Pages serves 404.html for any
          # unmatched path (still with an HTTP 404 status, browsers still
          # run its scripts) — an exact copy of the shell's own
          # index.html, safe because <base href> is an absolute path, not
          # relative to whatever URL 404.html happened to be served from.
          cp apps/shell/dist/index.html _site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
