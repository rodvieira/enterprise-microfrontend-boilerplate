name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build dashboard remote
        run: pnpm --filter @enterprise-mfe/dashboard run build

      - name: Build admin remote
        run: pnpm --filter @enterprise-mfe/admin run build

      - name: Build shell (production)
        run: FEDERATION_ENV=production pnpm --filter @enterprise-mfe/shell run build

      # One GitHub Pages site composing all three independent static
      # builds: the shell at the site root, each remote under its own
      # subpath — matching the URLs already committed in
      # apps/shell/src/internal/federation/remotes.production.json.
      - name: Assemble Pages site
        run: |
          mkdir -p _site/dashboard _site/admin
          cp -r apps/shell/dist/. _site/
          cp -r apps/dashboard/dist/. _site/dashboard/
          cp -r apps/admin/dist/. _site/admin/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
