# Real, automated dependency-update scanning (blueprint DoD "Dependabot/
# Renovate ... wired into CI", specs/007-docs-security research D2).
#
# Dependabot over Renovate: zero additional infrastructure — native to
# GitHub (this project's host), activates from this file alone, with no
# separate account/app-install step outside version control to trust was
# actually done.
version: 2
updates:
  # Dependabot's npm ecosystem understands pnpm-lock.yaml directly (GA
  # support) — no separate "pnpm" ecosystem exists or is needed.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # @types/node's major must track engines.node's major (currently
      # Node 22, "node": ">=22.22.2") — Dependabot has no way to know that
      # relationship on its own and will otherwise propose whatever the
      # latest major is, type-checking this codebase against Node APIs
      # the declared engine doesn't actually have (found for real: PR #28
      # proposed 22.10.2 -> 26.2.0). Bump this ignore rule deliberately,
      # together with `engines.node`, when the project's target Node
      # version actually changes — never independently.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Keeps pinned Action versions (actions/checkout@v4, etc.) current too —
  # the same automated-update guarantee, applied to .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
